spring:
  application:
    name: kista-trading

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      pool-name: HikariPool-KistaTrading
      connection-init-sql: "SET search_path TO trading, trading_ref"   # root 소유 public 테이블 참조 0 — scheduler_locks/event_publication은 trading 사본

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration-trading
    table: flyway_schema_history_trading
    baseline-on-migrate: false          # 운영 첫 기동에만 SPRING_FLYWAY_BASELINE_ON_MIGRATE=true 로 override(RUNBOOK)
    validate-on-migrate: true
    default-schema: trading             # 서비스 소유 스키마여야 baseline 판정(비어있음 여부)이 정확하다 — 설계 문서 "실측 근거"

  modulith:
    events:
      jdbc:
        schema: trading                 # trading 전용 event_publication — root(public)와 분리
        schema-initialization:
          enabled: false                # 테이블은 baseline V1이 소유

  data:
    redis:
      url: ${REDIS_URL}

server:
  port: ${SERVER_PORT:8081}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:}
    base-url: ${INTERNAL_API_BASE_URL:http://localhost:8080} # 이 프로세스가 나가는 내부 API 호출 대상(root) — root의 동일 키는 반대 방향(trading-core)을 가리켜야 함

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  signing-key: ${JWT_SIGNING_KEY}

crypto:
  aes-key: ${AES_ENCRYPTION_KEY} # AesCryptoService(:shared) — UserNotifyProfilePersistenceAdapter의 telegram_bot_token 암복호화

kis:
  base-url: https://openapi.koreainvestment.com:9443

toss:
  base-url: https://openapi.tossinvest.com
  admin-client-id: ${TOSS_ADMIN_CLIENT_ID:}
  admin-client-secret: ${TOSS_ADMIN_CLIENT_SECRET:}

telegram: # root와 동일 관리자 봇 공유(TelegramProperties 클래스 주석 참고) — 미설정 시 조용히 발송 생략
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

heartbeat: # 스케쥴러별 healthchecks.io 핑 — 미설정 시 핑 생략
  open-url: ${HEARTBEAT_OPEN_URL:}
  close-url: ${HEARTBEAT_CLOSE_URL:}

alpaca: # marketcalendar(휴장일)와 stats(백테스트 과거 일봉) 공용 — root와 동일 API 키 재사용
  base-url: https://paper-api.alpaca.markets
  api-key: ${ALPACA_API_KEY:}
  api-secret: ${ALPACA_API_SECRET:}
  data-base-url: https://data.alpaca.markets
