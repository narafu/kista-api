spring:
  application:
    name: kista-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      pool-name: HikariPool-KistaApi
      connection-init-sql: "SET search_path TO finance, kista_ref, public"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_api   # 서비스별 이력 테이블 — 옛 flyway_schema_history(V1~V23)는 롤백 증거로 보존
    baseline-on-migrate: false          # 운영 첫 기동에만 SPRING_FLYWAY_BASELINE_ON_MIGRATE=true 로 override(RUNBOOK)
    validate-on-migrate: true
    default-schema: public

  modulith:
    events:
      jdbc:
        schema: public
        schema-initialization:
          enabled: false   # event_publication 테이블은 baseline V1이 소유 — Modulith 자동 생성 비활성화
      republish-outstanding-events-on-restart: true   # 재기동 시 미완료 이벤트 자동 재시도

  task:
    scheduling:
      thread-name-prefix: kista-api-scheduler-

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        readiness:
          # 배포 헬스 게이트가 readiness로 DB·Redis 연결까지 확인한다(liveness는 연결 불능이어도 UP).
          # 전 프로필에 두는 이유: 존재하지 않는 인디케이터를 넣으면 부팅이 실패하므로 테스트 컨텍스트 로드가 이 구성을 같이 검증한다
          include: readinessState, db, redis
  metrics:
    tags:
      application: ${spring.application.name}

# 역할 게이트 — kista-api(HTTP) / kista-scheduler(배치) 같은 이미지 2-role 분리
# env 미설정 시 true (local·test 기존 동작 유지). prod는 application-prod.yml에서 false로 덮음
scheduler:
  enabled: ${SCHEDULER_ENABLED:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: 8080
  shutdown: graceful

telegram: # 빈 기본값 — @ConfigurationProperties는 해석 안 되는 ${X}를 문자열 그대로 바인딩하므로, 누락을 ""로 만들어 record @NotBlank가 기동 실패시키게 한다
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

crypto:
  aes-key: ${AES_ENCRYPTION_KEY}

app:
  cookie:
    secure: true        # prod: HTTPS 쿠키
    same-site: "None"   # prod: 크로스 오리진(kista-app.com→api.kista-app.com)

jwt:
  signing-key: ${JWT_SIGNING_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID:} # 빈 기본값 — telegram과 동일 이유(KakaoProperties @NotBlank)
  client-secret: ${KAKAO_CLIENT_SECRET:}

admin:
  kakao-ids: ${ADMIN_KAKAO_IDS:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:}
    base-url: ${INTERNAL_API_BASE_URL:http://localhost:8081} # 이 프로세스가 나가는 내부 API 호출 대상(trading-core) — 예전엔 자기 자신(단일 프로세스) 기본값이었으나 4a 분리 이후 trading-core 기본 포트(8081)로 정정

alpaca:
  api-key: ${ALPACA_API_KEY:}
  api-secret: ${ALPACA_API_SECRET:}
  data-base-url: https://data.alpaca.markets

kbland:
  base-url: https://data-api.kbland.kr

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

logging:
  level:
    root: INFO
    com.kista: DEBUG
