spring:
  application:
    name: kista-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5} # 한 애플리케이션(web·worker 각 인스턴스)당 풀 — 옛 2-프로세스 합계를 넘지 않게
      minimum-idle: 2
      connection-timeout: 20000
      pool-name: HikariPool-Kista
      connection-init-sql: "SET search_path TO finance, kista_ref, public"   # trading 엔티티·native SQL은 스키마를 명시하므로 root 값 하나로 충분

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: false   # Boot 자동구성 대신 kista.flyway.migrations를 KistaFlywayConfig가 순서대로 실행

  modulith:
    detection-strategy: explicitly-annotated   # @ApplicationModule(id) 붙은 패키지만 모듈 — 패키지 깊이와 무관하게 ID 고정
    events:
      completion-mode: delete   # 완료 행을 읽는 코드 없음 — 완료 시 행 삭제, 미완료 행만 남는다
      jdbc:
        schema: public   # 한 애플리케이션의 EPR은 public.event_publication 하나
        schema-initialization:
          enabled: false   # event_publication 테이블은 baseline V1이 소유 — Modulith 자동 생성 비활성화
      # republish-outstanding-events-on-restart는 두지 않는다(Modulith 기본 false — 로컬·테스트는 재기동 재발행 없음). prod도 false, compose가 worker에만 true로 켠다

  task:
    scheduling:
      thread-name-prefix: kista-api-scheduler-

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        readiness:
          # 배포 헬스 게이트가 readiness로 DB·Redis 연결까지 확인한다(liveness는 연결 불능이어도 UP).
          # 전 프로필에 두는 이유: 존재하지 않는 인디케이터를 넣으면 부팅이 실패하므로 테스트 컨텍스트 로드가 이 구성을 같이 검증한다
          include: readinessState, db, redis
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${kista.role} # web·worker 인스턴스 구분

springdoc:
  # 서버 간 내부 API(X-Internal-Token 전용)는 UI 타입 생성·공개 문서 대상이 아니다 — contract 타입이 UI DTO와 이름 충돌하는 것도 막는다
  paths-to-exclude: /api/internal/**
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: 8080
  shutdown: graceful

telegram: # 빈 기본값 — @ConfigurationProperties는 해석 안 되는 ${X}를 문자열 그대로 바인딩하므로, 누락을 ""로 만들어 record @NotBlank가 기동 실패시키게 한다
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

crypto:
  aes-key: ${AES_ENCRYPTION_KEY}

app:
  cookie:
    secure: true        # prod: HTTPS 쿠키
    same-site: "None"   # prod: 크로스 오리진(kista-app.com→api.kista-app.com)

jwt:
  signing-key: ${JWT_SIGNING_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID:} # 빈 기본값 — telegram과 동일 이유(KakaoProperties @NotBlank)
  client-secret: ${KAKAO_CLIENT_SECRET:}

admin:
  kakao-ids: ${ADMIN_KAKAO_IDS:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:}
    base-url: ${INTERNAL_API_BASE_URL:http://localhost:8080} # 내부 API 호출 대상 — 한 애플리케이션이라 기본값은 자기 자신

alpaca: # marketcalendar(휴장일)·stats(백테스트 과거 일봉)·broker(공용 시세)·benchmark 공용
  base-url: https://paper-api.alpaca.markets
  api-key: ${ALPACA_API_KEY:}
  api-secret: ${ALPACA_API_SECRET:}
  data-base-url: https://data.alpaca.markets

toss:
  base-url: https://openapi.tossinvest.com
  admin-client-id: ${TOSS_ADMIN_CLIENT_ID:}
  admin-client-secret: ${TOSS_ADMIN_CLIENT_SECRET:}

meritz:
  base-url: https://openapi.imeritz.com:9443  # 앱키마다 계좌 1개 — 서버 공용 시크릿 없음

heartbeat: # 스케쥴러별 healthchecks.io 핑 — 미설정 시 핑 생략
  open-url: ${HEARTBEAT_OPEN_URL:}
  close-url: ${HEARTBEAT_CLOSE_URL:}

kbland:
  base-url: https://data-api.kbland.kr

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

logging:
  level:
    root: INFO
    com.kista: DEBUG

kista:
  role: ${KISTA_ROLE:web} # web|worker|all — 로컬 기본 web, 테스트는 application-test.yml이 all, 운영은 compose가 지정
  flyway:
    migrations:
      - locations: classpath:db/migration
        table: flyway_schema_history_api   # 서비스별 이력 테이블 — 옛 공용 이력 테이블은 2026-11-16 운영에서 drop했다
        schema: public   # 서비스 소유 스키마여야 baseline 판정(비어있음 여부)이 정확하다
      - locations: classpath:db/migration-trading
        table: flyway_schema_history_trading
        schema: trading   # 서비스 소유 스키마여야 baseline 판정(비어있음 여부)이 정확하다
  scheduler-lock:
    table: trading.scheduler_locks # SchedulerLockService 락 테이블 — 스키마 한정 필수(매매 배치 락 행이 있는 쪽 하나로)
