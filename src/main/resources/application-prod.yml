spring:
  datasource:
    hikari:
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    show-sql: false
  lifecycle:
    timeout-per-shutdown-phase: 30s  # docker stop_grace_period와 쌍으로 관리
  modulith:
    events:
      # EPR 재발행 소유자 = worker role 단독. web role은 재발행 안 함
      # (양쪽 true면 미완료 event_publication 행을 둘 다 claim → 중복 알림)
      # compose가 worker 서비스에만 SPRING_MODULITH_EVENTS_REPUBLISH_OUTSTANDING_EVENTS_ON_RESTART=true로 되켬
      republish-outstanding-events-on-restart: false

# 운영 role은 compose가 KISTA_ROLE(web|worker)로 지정 — 기본값을 두지 않아 누락 시 기동 실패(web이 worker로 뜨는 중복 배치 방지)
kista:
  role: ${KISTA_ROLE}

management:
  health:
    probes:
      enabled: true  # /actuator/health/liveness + /actuator/health/readiness 활성화
  endpoint:
    health:
      show-details: never
  otlp:
    metrics:
      export:
        enabled: ${GRAFANA_CLOUD_OTLP_ENABLED:false} # Grafana Cloud 미설정 환경(로컬 재현 등)에서 push 시도로 인한 커넥션 재시도 방지
        url: ${GRAFANA_CLOUD_OTLP_ENDPOINT:}
        headers:
          Authorization: ${GRAFANA_CLOUD_OTLP_AUTH_HEADER:}
        step: 60s

logging:
  level:
    root: WARN
    com.kista: INFO
