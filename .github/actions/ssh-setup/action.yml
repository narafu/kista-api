name: ssh-setup
description: 배포 서버 SSH 키·known_hosts 구성 + remote/upload 헬퍼 설치 — 호스트 키는 secret에 고정된 값만 신뢰한다(ssh-keyscan TOFU 금지)

inputs:
  ssh-key:
    description: 배포용 SSH 개인키
    required: true
  host:
    description: 서버 호스트
    required: true
  user:
    description: SSH 사용자
    required: true
  port:
    description: SSH 포트
    required: false
    default: '22'
  host-keys:
    description: '서버 공개 호스트 키 목록 ("<keytype> <base64>" 한 줄씩, 호스트명 없이 — SERVER_SSH_HOST_KEYS)'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        HOST: ${{ inputs.host }}
        USER_NAME: ${{ inputs.user }}
        PORT: ${{ inputs.port }}
        HOST_KEYS: ${{ inputs.host-keys }}
      run: |
        [ -n "$HOST_KEYS" ] || { echo "::error::SERVER_SSH_HOST_KEYS secret 미설정 — 서버 호스트 키를 고정해야 배포할 수 있습니다"; exit 1; }
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # known_hosts 호스트 필드: 22번 포트는 호스트명 그대로, 그 외는 [host]:port 형식
        if [ "$PORT" = "22" ]; then entry="$HOST"; else entry="[$HOST]:$PORT"; fi
        while IFS= read -r key; do
          if [ -n "$key" ]; then printf '%s %s\n' "$entry" "$key"; fi
        done < <(tr -d '\r' <<<"$HOST_KEYS") > ~/.ssh/known_hosts   # CRLF로 붙여넣은 secret 방어
        chmod 600 ~/.ssh/known_hosts

        # 이후 스텝용 헬퍼 — remote "<서버 명령>", upload <로컬 파일...> <서버 경로>
        bin="$HOME/.local/deploy-bin"
        mkdir -p "$bin"
        printf '#!/usr/bin/env bash\nexec ssh -i ~/.ssh/deploy_key -p %q %q "$@"\n' "$PORT" "$USER_NAME@$HOST" > "$bin/remote"
        printf '#!/usr/bin/env bash\nexec scp -i ~/.ssh/deploy_key -P %q "${@:1:$#-1}" %q:"${@: -1}"\n' "$PORT" "$USER_NAME@$HOST" > "$bin/upload"
        chmod +x "$bin/remote" "$bin/upload"
        echo "$bin" >> "$GITHUB_PATH"
