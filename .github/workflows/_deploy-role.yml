name: _deploy-role

# role 1개 배포. 판정 로직은 .github/scripts/*.sh(러너), 서버 작업은 deploy/server/bin/*.sh(원격)에 있고 둘 다 bats로 검증한다
# (.github/tests) — 이 파일은 순서와 입출력 배선만 담당한다.

on:
  workflow_call:
    inputs:
      image:
        description: '배포할 GHCR 이미지 (SHA 태그)'
        required: true
        type: string
      service:
        description: 'docker compose 서비스명 (kista-api | kista-scheduler | kista-trading)'
        required: true
        type: string
      apply_trading_guard:
        description: '매매 시간대 배포 가드 적용 여부'
        required: true
        type: boolean
      epr_schema:
        description: '이 role이 재발행하는 event_publication 스키마(trading | public) — 비우면 EPR 고아 검사 생략'
        required: false
        type: string
        default: ''
      force:
        description: 'workflow_dispatch force 입력 (매매 가드·EPR 검사 무시)'
        required: false
        type: string
        default: 'false'

env:
  DEPLOY_PATH: /opt/kista-api

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    concurrency: server-${{ inputs.service }}
    environment:
      name: production
    env:
      SERVICE: ${{ inputs.service }}
      KISTA_API_IMAGE: ${{ inputs.image }}
      # 롤백 기록을 이 run 시도에 묶는 식별자 — 다른 run이 남긴 기록으로 엉뚱하게 롤백하는 것 방지
      RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # 실행 중 SHA와의 선후 판정용

      - uses: ./.github/actions/ssh-setup
        with:
          ssh-key: ${{ secrets.SERVER_SSH_KEY }}
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          host-keys: ${{ secrets.SERVER_SSH_HOST_KEYS }}
          user: ${{ secrets.SERVER_USER }}

      # 옛 run의 Re-run(가드 차단 후 재실행 등)이 더 새 버전을 과거로 되돌리는 것 방지 — 판정 근거는 newer-running.sh 주석
      - name: Skip if a newer commit is already running
        id: fresh
        run: |
          if newer=$(remote "docker inspect -f '{{.Name}} {{.Config.Image}}' kista-api kista-scheduler kista-trading" 2>/dev/null \
                     | bash .github/scripts/newer-running.sh "${KISTA_API_IMAGE##*:}"); then
            echo "::notice::더 새 커밋이 실행 중(${newer}) — ${SERVICE} 배포 생략"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # 원격 스크립트는 role별 디렉토리로 올린다 — 세 role 잡이 같은 파일을 덮어쓰면 실행 중인 bash가 깨진다.
      # compose·스니펫도 role별 스테이징 파일명으로 올리고 실제 교체는 deploy-role.sh가 배포 락 안에서 한다
      - name: Upload deployment files
        if: steps.fresh.outputs.skip != 'true'
        run: |
          remote "mkdir -p '${DEPLOY_PATH}/caddy' '${DEPLOY_PATH}/rollback' '${DEPLOY_PATH}/bin/${SERVICE}'"
          upload deploy/server/bin/*.sh "${DEPLOY_PATH}/bin/${SERVICE}/"
          upload deploy/server/docker-compose.yml "${DEPLOY_PATH}/docker-compose.yml.${SERVICE}"
          upload deploy/server/caddy/kista-api.caddy "${DEPLOY_PATH}/caddy/kista-api.caddy.${SERVICE}"

      - name: 매매 시간대 배포 가드 (KST 시각 + 실행 중 매매 배치 락)
        if: inputs.apply_trading_guard && inputs.force != 'true' && steps.fresh.outputs.skip != 'true'
        run: |
          locks=$(remote "bash '${DEPLOY_PATH}/bin/${SERVICE}/trading-locks.sh'") \
            || { echo "::error::scheduler_locks 조회 실패 — 매매 배치 실행 여부를 판정할 수 없어 차단합니다(fail-closed). 확인 후 workflow_dispatch force=true로 우회하세요."; exit 1; }
          if ! reason=$(bash .github/scripts/trading-guard.sh "$(TZ=Asia/Seoul date +%u)" "$(TZ=Asia/Seoul date +%H%M)" "$locks" 2>&1); then
            echo "::error::KST $(TZ=Asia/Seoul date +%H:%M) 차단 — ${reason}. kista-trading 재기동이 sleep 중인 매매 스레드를 강제 종료하거나 재기동 중 EPR이 미완료 매매 이벤트를 재발행해 주문 접수 유실·알림 중복이 생길 수 있습니다. 차단 해제 후 이 잡만 Re-run(더 새 커밋이 이미 배포됐으면 자동 생략). 긴급 시 workflow_dispatch force=true."
            exit 1
          fi
          echo "매매 가드 통과 (KST $(TZ=Asia/Seoul date +%H:%M))"

      # 이벤트·리스너 패키지 이동/개명 커밋이 재발행 role 재기동 시 고아 row(ClassNotFoundException 반복·영구 미매칭)를 만들지 않는지 확인
      - name: EPR 고아 검사 (${{ inputs.epr_schema }})
        if: inputs.epr_schema != '' && inputs.force != 'true' && steps.fresh.outputs.skip != 'true'
        run: |
          pending=$(remote "bash '${DEPLOY_PATH}/bin/${SERVICE}/epr-pending.sh' '${{ inputs.epr_schema }}'") \
            || { echo "::error::event_publication 조회 실패 — 고아 여부를 판정할 수 없어 차단합니다. 확인 후 workflow_dispatch force=true로 우회하세요."; exit 1; }
          if ! orphans=$(bash .github/scripts/epr-orphans.sh <<<"$pending"); then
            echo "$orphans"
            echo "::error::미완료 EPR row가 이 커밋에 없는 이벤트·리스너를 참조합니다 — docs/agents/docker-infra.md '배포 직전 EPR 정리 런북'대로 ${{ inputs.epr_schema }}.event_publication을 정리한 뒤 Re-run 하세요."
            exit 1
          fi
          echo "EPR 고아 없음"

      - name: Verify .env and restart ${{ inputs.service }}
        id: restart
        if: steps.fresh.outputs.skip != 'true'
        run: remote "DEPLOY_PATH='${DEPLOY_PATH}' SERVICE='${SERVICE}' KISTA_API_IMAGE='${KISTA_API_IMAGE}' RUN_TAG='${RUN_TAG}' bash '${DEPLOY_PATH}/bin/${SERVICE}/deploy-role.sh'"

      # restart가 실패해도(up 도중 실패 등) 컨테이너 교체가 시작됐다면 롤백해야 하므로 실행 — 교체 여부는 health-gate.sh가 run 식별자로 판정
      - name: Health gate & auto-rollback (${{ inputs.service }})
        if: ${{ !cancelled() && steps.restart.outcome != 'skipped' }}
        run: remote "DEPLOY_PATH='${DEPLOY_PATH}' SERVICE='${SERVICE}' KISTA_API_IMAGE='${KISTA_API_IMAGE}' RUN_TAG='${RUN_TAG}' bash '${DEPLOY_PATH}/bin/${SERVICE}/health-gate.sh'"
