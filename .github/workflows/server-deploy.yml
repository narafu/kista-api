name: Server Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: '매매 시간대 가드를 무시하고 강제 배포'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/kista-api

jobs:
  verify:
    name: Full Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kistadb
          POSTGRES_USER: kista
          POSTGRES_PASSWORD: kista
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Create test database
        run: psql -h localhost -U kista -d kistadb -c "CREATE DATABASE kistadb_test OWNER kista;"
        env:
          PGPASSWORD: kista
      - name: Run all tests (ArchUnit 포함)
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image: ${{ steps.image.outputs.image }}
      latest: ${{ steps.image.outputs.latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    concurrency: server-production
    environment:
      name: production
    steps:
      - name: 매매 시간대 배포 가드 (KST)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.force != 'true'
        run: |
          now=$((10#$(TZ=Asia/Seoul date +%H%M)))
          dow=$(TZ=Asia/Seoul date +%u)   # 1=월 ... 7=일
          blocked=no
          # 개장 스케쥴러 실행 구간: 월~금 22:20~23:40 KST (22:30 기동, 비DST 23:30 개장 접수)
          if [ "$dow" -le 5 ] && [ "$now" -ge 2220 ] && [ "$now" -le 2340 ]; then blocked=yes; fi
          # 마감 스케쥴러 실행 구간: 화~토 04:20~06:20 KST (04:30 기동, 비DST 06:10 리포트)
          if [ "$dow" -ge 2 ] && [ "$dow" -le 6 ] && [ "$now" -ge 420 ] && [ "$now" -le 620 ]; then blocked=yes; fi
          if [ "$blocked" = yes ]; then
            echo "::error::현재 KST $(TZ=Asia/Seoul date +%H:%M)는 매매 스케쥴러 실행 시간대 — 배포가 sleep 중인 매매 스레드를 강제 종료해 주문 접수가 유실될 수 있어 차단합니다. 장 종료 후 Actions에서 Re-run 하거나, 긴급 시 workflow_dispatch force=true로 강제 배포하세요."
            exit 1
          fi
          echo "매매 시간대 아님 (KST $(TZ=Asia/Seoul date +%H:%M)) — 배포 진행"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/deploy_key -P "$SERVER_SSH_PORT" \
            deploy/server/docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:${DEPLOY_PATH}/"

      - name: Verify .env and restart application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
          KISTA_API_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' KISTA_API_IMAGE='${KISTA_API_IMAGE}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            # 필수 환경변수 존재 검증 (.env 서버 직접 관리)
            for key in DB_URL DB_USERNAME DB_PASSWORD JWT_SIGNING_KEY AES_ENCRYPTION_KEY KAKAO_CLIENT_ID CORS_ALLOWED_ORIGINS TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID API_DOMAIN; do
              grep -q "^${key}=" .env || { echo "::error::필수 환경변수 누락: ${key}"; exit 1; }
            done

            # 현재 이미지 저장 (롤백용)
            PREV_IMAGE=$(docker compose ps kista-api --format '{{.Image}}' 2>/dev/null || echo "")
            echo "$PREV_IMAGE" > /tmp/kista-prev-image

            # GHCR 로그인 + kista-api만 타겟 배포 (--no-deps로 다른 서비스 재생성 방지)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export KISTA_API_IMAGE
            docker compose pull kista-api

            # shared_net/data_net은 kista-infra가 생성/소유 — kista-infra가 아직 배포되지 않은 상태에서
            # kista-api가 먼저 배포되는 경우(최초 셋업 순서 실수 등)를 막기 위한 방어적 멱등 생성
            # (docker network create는 인자 1개만 허용 — 여러 개를 한 번에 넘기면 에러)
            for net in shared_net data_net; do docker network create "$net" 2>/dev/null || true; done

            docker compose up -d --no-deps kista-api
          ENDSSH

      - name: Health gate & auto-rollback
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            echo "헬스 게이트 시작 (최대 5분)..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' kista-api 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ 헬스체크 통과 (${i}회 시도)"
                echo "  전체 헬스체크(DB/Redis 포함) 관측 중..."
                docker exec kista-api wget -qO- http://localhost:8080/actuator/health || echo "  (관측 실패 — 배포는 계속 진행, DB/Redis 설정을 확인하세요)"
                docker image prune -f || true
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ 헬스체크 실패 (unhealthy, ${i}회 시도)"
                break
              fi
              echo "  대기 중... (${i}/30, 상태: ${STATUS})"
              sleep 10
            done

            # 헬스체크 실패 → 이전 이미지로 자동 롤백
            PREV_IMAGE=$(cat /tmp/kista-prev-image 2>/dev/null || echo "")
            if [ -n "$PREV_IMAGE" ]; then
              echo "✗ 헬스체크 실패 — 이전 이미지로 롤백: $PREV_IMAGE"
              export KISTA_API_IMAGE="$PREV_IMAGE"
              docker compose up -d --no-deps kista-api
            else
              echo "✗ 헬스체크 실패 — 이전 이미지 정보 없음, 수동 복구 필요"
            fi
            exit 1
          ENDSSH
