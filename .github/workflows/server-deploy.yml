name: Server Deploy

# 배포 = kista-infra에 목표 상태(config SHA + role별 이미지 SHA)를 dispatch하고 서버 적용 결과까지 대기.
# 판정은 .github/scripts(bats로 검증), 서버 적용·헬스 게이트·롤백은 kista-infra reconcile.yml + deploy/bin/reconcile.sh.
# 설계: kista-infra/docs/superpowers/specs/2026-10-02-deploy-reconcile-design.md

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'pre-apply hook(EPR 고아 검사) 생략'
        required: false
        default: 'false'
      build_only:
        description: '이미지 빌드·푸시만 하고 배포 요청은 건너뜀'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  # 기준점 = kista-infra state/kista-api.yml(마지막 서버 적용 성공 상태). 직전 push 기준이면 실패·생략된 커밋을 영영 놓친다.
  # 수동 실행은 state SHA를 0으로 바꿔 "히스토리에 없음 → target"으로 config·전 role을 이 커밋으로 판정
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
      build: ${{ steps.plan.outputs.build }}
      deploy: ${{ steps.plan.outputs.deploy }}
      config: ${{ steps.plan.outputs.config }}
      roles: ${{ steps.plan.outputs.roles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # kista-infra 전용 GitHub App의 1시간짜리 설치 토큰 — 장기 PAT 대신(유출돼도 곧 무효, 갱신 불필요)
      - name: kista-infra 앱 토큰
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: narafu
          repositories: kista-infra
          permission-contents: write   # state 조회 + repository_dispatch
          permission-actions: read     # reconcile run 추적
      - name: state 기준 배포 계획
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          EVENT: ${{ github.event_name }}
        run: |
          state=$(gh api repos/narafu/kista-infra/contents/state/kista-api.yml -H 'Accept: application/vnd.github.raw')
          if [ "$EVENT" = workflow_dispatch ]; then
            state=$(sed -E 's/^(config|  [a-z-]+): *[0-9a-f]+$/\1: 0000000000000000000000000000000000000000/' <<<"$state")
          fi
          plan=$(bash .github/scripts/plan-deploy.sh "$GITHUB_SHA" <<<"$state")
          echo "$plan" | tee -a "$GITHUB_OUTPUT"

  # 배포 판정 스크립트·hook 정적 분석·단위 테스트 + 마이그레이션 안전 검사 — 통과해야 이미지를 만들고 배포 요청을 보낸다
  deploy-checks:
    name: Deploy Scripts & Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh deploy/hooks/*.sh .github/tests/stub/gh
      - name: bats
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats >/dev/null
          bats .github/tests
      - name: Flyway 마이그레이션 검사 (적용 이력 불변 + root expand/contract)
        env:
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/check-migrations.sh "$BEFORE"

  verify:
    name: Full Test Suite
    needs: plan
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kistadb
          POSTGRES_USER: kista
          POSTGRES_PASSWORD: kista
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # notify Redis Pub/Sub 이관(ec3cec1e) 이후 ApplicationContextLoadTest 등 컨텍스트 로드 테스트가
      # RedisMessageListenerContainer 빈 생성 시 연결을 시도한다 — ci.yml과 동일 패턴으로 추가(로컬은 이미 떠 있어 누락이 안 드러났었음)
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Create test database
        run: psql -h localhost -U kista -d kistadb -c "CREATE DATABASE kistadb_test OWNER kista;"
        env:
          PGPASSWORD: kista
      - name: Run all tests (ArchUnit 포함) + integration
        # ci.yml(PR 전용)과 달리 main 직접 push 경로에서도 @Tag("integration")을 돌린다 — 대부분 PR 없이 push하므로 여기 없으면 사실상 미실행
        run: ./gradlew test integration --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

  build:
    name: Build & Push Image
    # 배포 대상(OCI)이 arm64라 네이티브 arm64 러너에서 빌드한다(public 레포 무료). 2026-09-30 QEMU 에뮬레이션에서 전환 —
    # kista-ui가 같은 구조(x86 + QEMU)에서 빌드 워커 SIGILL 크래시·무한 대기를 겪어 선제 적용.
    # 주의: 레포를 private으로 바꾸면 이 러너는 유료/미할당이라 job이 시작조차 안 되고 무한 대기한다.
    runs-on: ubuntu-24.04-arm
    # verify(테스트 ~4분)와 병렬로 빌드 — deploy 잡이 verify 성공을 따로 기다리므로 테스트 실패 이미지는 push돼도 배포되지 않는다
    needs: [plan, deploy-checks]
    if: needs.plan.outputs.build == 'true'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: |
          # SHA 태그만 — 배포·변경감지·롤백 모두 SHA로 식별하고 :latest는 어디서도 쓰지 않는다
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Gradle 의존성 레이어(./gradlew dependencies) 재사용 — 없으면 매 빌드 콜드 다운로드
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.image }}

  # 서버 적용은 kista-infra Reconcile App이 한다(검증·신선도 병합·EPR hook·reconcile.sh·state 커밋). 여기선 요청 후 결과까지 대기 —
  # 커밋의 초록불 = 서버 적용·헬스 게이트 통과. 대기 중 더 새 요청이 대체하면(취소) 생략으로 성공 처리
  deploy:
    name: Deploy (kista-infra reconcile)
    needs: [plan, deploy-checks, verify, build]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.deploy == 'true' && github.event.inputs.build_only != 'true'
      && needs.deploy-checks.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.verify.result)
      && contains(fromJSON('["success","skipped"]'), needs.build.result)
    runs-on: ubuntu-latest
    timeout-minutes: 75   # infra reconcile 대기열(앞선 run 최대 30분) + 자기 run 30분 + 여유
    environment:
      name: production
    env:
      CONFIG: ${{ needs.plan.outputs.config }}
      ROLES: ${{ needs.plan.outputs.roles }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
      REQUEST_ID: kista-api-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # kista-infra 전용 GitHub App의 1시간짜리 설치 토큰 — 장기 PAT 대신(유출돼도 곧 무효, 갱신 불필요)
      - name: kista-infra 앱 토큰
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: narafu
          repositories: kista-infra
          permission-contents: write   # state 조회 + repository_dispatch
          permission-actions: read     # reconcile run 추적
      - name: dispatch
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          gh api repos/narafu/kista-infra/dispatches -f event_type=deploy-kista-api             -f "client_payload[app]=kista-api" -f "client_payload[config]=$CONFIG" -f "client_payload[roles]=$ROLES"             -f "client_payload[request_id]=$REQUEST_ID" -f "client_payload[force]=$FORCE"
      # 앱 토큰은 1시간이면 만료 — 50분 안에 안 끝나면 run_id를 넘기고 토큰을 재발급해 이어서 대기(job timeout 75분 설계 유지)
      - name: 서버 적용 대기
        id: wait
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          WATCH_TIMEOUT: 50m
        run: bash .github/scripts/wait-reconcile.sh "$REQUEST_ID"
      - name: kista-infra 앱 토큰 재발급
        id: infra-token-2
        if: steps.wait.outputs.run_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: narafu
          repositories: kista-infra
          permission-actions: read     # reconcile run 추적
      - name: 서버 적용 대기 (이어서)
        if: steps.wait.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ steps.infra-token-2.outputs.token }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        run: bash .github/scripts/wait-reconcile.sh "$REQUEST_ID"
