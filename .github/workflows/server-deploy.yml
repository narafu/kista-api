name: Server Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: '매매 시간대 가드를 무시하고 강제 배포'
        required: false
        default: 'false'
      build_only:
        description: '이미지 빌드·푸시만 하고 서버 배포는 건너뜀 (수동 SSH 런북용)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  # 변경 경로로 배포 범위 판정 — 판정 불가(수동 실행·최초 push·force push로 base 소실)면 전부 true
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      api: ${{ steps.scope.outputs.api }}
      scheduler: ${{ steps.scope.outputs.scheduler }}
      trading: ${{ steps.scope.outputs.trading }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            printf 'verify=true\napi=true\nscheduler=true\ntrading=true\n' | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" | bash .github/scripts/detect-deploy-scope.sh | tee -a "$GITHUB_OUTPUT"
          fi

  verify:
    name: Full Test Suite
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kistadb
          POSTGRES_USER: kista
          POSTGRES_PASSWORD: kista
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # notify Redis Pub/Sub 이관(ec3cec1e) 이후 ApplicationContextLoadTest 등 컨텍스트 로드 테스트가
      # RedisMessageListenerContainer 빈 생성 시 연결을 시도한다 — ci.yml과 동일 패턴으로 추가(로컬은 이미 떠 있어 누락이 안 드러났었음)
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Create test database
        run: psql -h localhost -U kista -d kistadb -c "CREATE DATABASE kistadb_test OWNER kista;"
        env:
          PGPASSWORD: kista
      - name: Run all tests (ArchUnit 포함)
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.trading == 'true'
    outputs:
      image: ${{ steps.image.outputs.image }}
      latest: ${{ steps.image.outputs.latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}

  deploy-api:
    name: Deploy API
    needs: [changes, build]
    if: needs.changes.outputs.api == 'true' && github.event.inputs.build_only != 'true'
    uses: ./.github/workflows/_deploy-role.yml
    with:
      image: ${{ needs.build.outputs.image }}
      service: kista-api
      apply_trading_guard: false
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit

  deploy-scheduler:
    name: Deploy Scheduler
    needs: [changes, build]
    if: needs.changes.outputs.scheduler == 'true' && github.event.inputs.build_only != 'true'   # kista-api와 같은 app.jar이지만 스케쥴러 전용 빈만 바뀐 경우는 이 잡만 실행
    uses: ./.github/workflows/_deploy-role.yml
    with:
      image: ${{ needs.build.outputs.image }}
      service: kista-scheduler
      apply_trading_guard: false
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit

  deploy-trading:
    name: Deploy Trading
    needs: [changes, build]
    if: needs.changes.outputs.trading == 'true' && github.event.inputs.build_only != 'true'
    uses: ./.github/workflows/_deploy-role.yml
    with:
      image: ${{ needs.build.outputs.image }}
      service: kista-trading
      apply_trading_guard: true
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit
