name: Server Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: '매매 시간대 가드를 무시하고 강제 배포'
        required: false
        default: 'false'
      build_only:
        description: '이미지 빌드·푸시만 하고 서버 배포는 건너뜀 (수동 SSH 런북용)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  # 변경 경로로 배포 범위 판정 — 기준점은 직전 push가 아니라 서버에서 각 role이 "지금 실행 중인" 이미지 SHA.
  # 직전 push 기준이면 가드 차단·헬스 롤백으로 배포가 빠진 커밋을 다음 push가 영영 놓친다(조용한 드리프트).
  # 판정 불가(수동 실행·컨테이너 없음·SHA가 히스토리에 없음)면 그 role은 true, 실행 중인 SHA가 더 새것이면 false
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      api: ${{ steps.scope.outputs.api }}
      scheduler: ${{ steps.scope.outputs.scheduler }}
      trading: ${{ steps.scope.outputs.trading }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ssh-setup
        with:
          ssh-key: ${{ secrets.SERVER_SSH_KEY }}
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          host-keys: ${{ secrets.SERVER_SSH_HOST_KEYS }}
      - name: Classify changed paths per role
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            printf 'verify=true\napi=true\nscheduler=true\ntrading=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # role별 실행 중 이미지 태그(= 커밋 SHA) 조회 — SSH 실패·컨테이너 부재는 빈 값으로 두고 아래에서 전부 배포로 처리
          declare -A running
          while read -r name image; do running[${name#/}]=${image##*:}; done < <(
            ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
              "docker inspect -f '{{.Name}} {{.Config.Image}}' kista-api kista-scheduler kista-trading" 2>/dev/null || true)
          verify=false
          for role in api scheduler trading; do
            sha=${running[kista-$role]:-}
            if [ -n "$sha" ] && git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
                flags="verify=false"$'\n'"$role=false"   # 이미 이 커밋 이상이 실행 중 — 옛 run 재실행이 롤백하는 것 방지
              else
                flags=$(git diff --name-only "$sha" "$GITHUB_SHA" | bash .github/scripts/detect-deploy-scope.sh)
              fi
            else
              flags="verify=true"$'\n'"$role=true"
            fi
            echo "kista-$role: running=${sha:-none}"
            grep "^$role=" <<<"$flags" | tee -a "$GITHUB_OUTPUT"
            grep -q '^verify=true' <<<"$flags" && verify=true
          done
          echo "verify=$verify" | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Full Test Suite
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kistadb
          POSTGRES_USER: kista
          POSTGRES_PASSWORD: kista
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # notify Redis Pub/Sub 이관(ec3cec1e) 이후 ApplicationContextLoadTest 등 컨텍스트 로드 테스트가
      # RedisMessageListenerContainer 빈 생성 시 연결을 시도한다 — ci.yml과 동일 패턴으로 추가(로컬은 이미 떠 있어 누락이 안 드러났었음)
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Create test database
        run: psql -h localhost -U kista -d kistadb -c "CREATE DATABASE kistadb_test OWNER kista;"
        env:
          PGPASSWORD: kista
      - name: Run all tests (ArchUnit 포함) + integration
        # ci.yml(PR 전용)과 달리 main 직접 push 경로에서도 @Tag("integration")을 돌린다 — 대부분 PR 없이 push하므로 여기 없으면 사실상 미실행
        run: ./gradlew test integration --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

  build:
    name: Build & Push Image
    # 배포 대상(OCI)이 arm64라 네이티브 arm64 러너에서 빌드한다(public 레포 무료). 2026-09-30 QEMU 에뮬레이션에서 전환 —
    # kista-ui가 같은 구조(x86 + QEMU)에서 빌드 워커 SIGILL 크래시·무한 대기를 겪어 선제 적용.
    # 주의: 레포를 private으로 바꾸면 이 러너는 유료/미할당이라 job이 시작조차 안 되고 무한 대기한다.
    runs-on: ubuntu-24.04-arm
    needs: [changes, verify]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.trading == 'true'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: |
          # SHA 태그만 — 배포·변경감지·롤백 모두 SHA로 식별하고 :latest는 어디서도 쓰지 않는다
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Gradle 의존성 레이어(./gradlew dependencies) 재사용 — 없으면 매 빌드 콜드 다운로드
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.image }}

  deploy-api:
    name: Deploy API
    needs: [changes, build]
    if: needs.changes.outputs.api == 'true' && github.event.inputs.build_only != 'true'
    uses: ./.github/workflows/_deploy-role.yml
    with:
      image: ${{ needs.build.outputs.image }}
      service: kista-api
      apply_trading_guard: false
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit

  deploy-scheduler:
    name: Deploy Scheduler
    needs: [changes, build]
    if: needs.changes.outputs.scheduler == 'true' && github.event.inputs.build_only != 'true'   # kista-api와 같은 app.jar이지만 스케쥴러 전용 빈만 바뀐 경우는 이 잡만 실행
    uses: ./.github/workflows/_deploy-role.yml
    with:
      image: ${{ needs.build.outputs.image }}
      service: kista-scheduler
      apply_trading_guard: false
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit

  deploy-trading:
    name: Deploy Trading
    needs: [changes, build]
    if: needs.changes.outputs.trading == 'true' && github.event.inputs.build_only != 'true'
    uses: ./.github/workflows/_deploy-role.yml
    with:
      image: ${{ needs.build.outputs.image }}
      service: kista-trading
      apply_trading_guard: true
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit
