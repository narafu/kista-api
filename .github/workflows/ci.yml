name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # server-deploy.yml deploy-checks와 같은 검사 — PR 단계에서 미리 잡는다
  deploy-checks:
    runs-on: ubuntu-24.04 # 명시 고정 — ubuntu-latest는 2026-10-19부터 Ubuntu 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: shellcheck .github/scripts/*.sh deploy/hooks/*.sh .github/tests/stub/gh
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats >/dev/null
          bats .github/tests
      - name: Flyway 마이그레이션 검사 (적용 이력 불변 + root expand/contract)
        run: bash .github/scripts/check-migrations.sh "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-24.04 # 명시 고정 — ubuntu-latest는 2026-10-19부터 Ubuntu 26

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: kistadb
          POSTGRES_USER: kista
          POSTGRES_PASSWORD: kista
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # @Tag("integration") 테스트 중 TossRedisTokenStoreIT가 localhost:6379를 직접 사용한다
      # (docs/agents/testing.md 참고 — 로컬 개발 환경엔 이미 떠 있어 CI에서만 이 서비스가 빠져 있었다)
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create test database
        run: psql -h localhost -U kista -d kistadb -c "CREATE DATABASE kistadb_test OWNER kista;" -c "CREATE DATABASE kistadb_it OWNER kista;"
        env:
          PGPASSWORD: kista

      - name: Run tests
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Run integration tests
        run: ./gradlew integration
        env:
          SPRING_PROFILES_ACTIVE: test
